name: Coverage gate

on:
  pull_request:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Enforce 85% coverage
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse('coverage.xml').getroot()
          line_rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Coverage: {line_rate:.2f}%')

          summary_path = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary_path, 'a', encoding='utf-8') as fh:
              fh.write(f'## Coverage\n\n{line_rate:.2f}% line coverage on src/.\n')

          if line_rate < 85:
              raise SystemExit(f'Coverage below required threshold: {line_rate:.2f}% < 85%')
          PY
        env:
          GITHUB_STEP_SUMMARY: ${{ github.workspace }}/coverage-summary.md
